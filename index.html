<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банка побажань</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: Arial, sans-serif;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Банка побажань 🌟</h2>
        <textarea id="wishText" placeholder="Напишіть своє побажання тут..."></textarea>
        <button onclick="sendWish()">Надіслати</button>
        <div id="status"></div>
    </div>

    <script>
        // Ваше актуальне посилання на веб-додаток Google Apps Script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwiG5Xsz8bRx-FYIw6Vj7gcBq0-nFkoYhXMJU-c-d07kkmLUSGBzL1opbttpcjBlf5k/exec";

        function sendWish() {
            const text = document.getElementById("wishText").value.trim();
            const statusDiv = document.getElementById("status");

            if (!text) {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Будь ласка, напишіть щось!";
                return;
            }

            statusDiv.style.color = "#666";
            statusDiv.innerText = "Надсилання...";

            // Оскільки GAS на POST-запити іноді дає блокування CORS у браузерах, 
            // використовуємо GET-запит через створення картинки/iframe або звичайний fetch з mode: 'no-cors'
            const url = SCRIPT_URL + "?action=addWish&wish=" + encodeURIComponent(text);

            fetch(url, { method: "GET", mode: "no-cors" })
                .then(() => {
                    statusDiv.style.color = "green";
                    statusDiv.innerText = "Дякуємо! Побажання надіслано ❤️";
                    document.getElementById("wishText").value = "";
                })
                .catch(error => {
                    statusDiv.style.color = "red";
                    statusDiv.innerText = "Помилка надсилання.";
                    console.error("Error:", error);
                });
        }
    </script>

</body>
</html>
